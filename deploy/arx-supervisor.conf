; Arx game server — supervisor program.
; Install (as root):
;   cp deploy/arx-supervisor.conf /etc/supervisor/conf.d/arx.conf
;   supervisorctl reread && supervisorctl update
; Then operate it with scripts/arxctl.sh {start|stop|restart|status|ping}.
;
; Alternative: create a Forge Daemon with command
;   bash /home/forge/arx.gg/scripts/arx-run.sh
; and directory /home/forge/arx.gg — then set ARX_PROGRAM="daemon-<id>:*"
; in .env so arxctl.sh addresses it.

[program:arx]
command=/bin/bash /home/forge/arx.gg/scripts/arx-run.sh
directory=/home/forge/arx.gg
user=forge
autostart=true
autorestart=true
startretries=10
; Give the server time to flush SQLite + close sockets on TERM.
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/home/forge/arx-server.log
redirect_stderr=true
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
