; Arx game server — supervisor program.
; Install (as root):
;   cp deploy/arx-supervisor.conf /etc/supervisor/conf.d/arx.conf
;   supervisorctl reread && supervisorctl update
; Then operate it with scripts/arxctl.sh {start|stop|restart|status|ping}.
;
; Alternative: create a Forge Daemon with command
;   bash /home/forge/arx.gg/current/scripts/arx-run.sh
; and directory /home/forge/arx.gg/current — then set
; ARX_PROGRAM="daemon-<id>:*" in .env so arxctl.sh addresses it.
;
; Paths assume Forge release deployments: current -> releases/<n> is
; swung on activation, and the deploy script's `arxctl.sh restart`
; moves the server onto the new release. On an in-place (git pull)
; layout, drop the /current segment.

[program:arx]
command=/bin/bash /home/forge/arx.gg/current/scripts/arx-run.sh
directory=/home/forge/arx.gg/current
user=forge
autostart=true
autorestart=true
startretries=10
; Give the server time to drain the Postgres write FIFO + close sockets
; on TERM (the server's own drain deadline is 10 s; see index.ts).
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/home/forge/arx-server.log
redirect_stderr=true
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
