# Arx — nginx additions for the Forge site arx.gg.
# Paste these location blocks into the site's nginx config (Forge →
# site → Edit Nginx Configuration), inside the `server { }` block that
# Forge generated, ABOVE the default `location /` block.
#
# The site's web root must be /home/forge/arx.gg/public (the Vite
# build output). Forge terminates TLS; the client connects to
# wss://arx.gg/ws, which this proxies to the game server on loopback.

# Abuse throttles for the WebSocket door. These two ZONE directives
# must sit ABOVE the `server { }` block (http context — the top of the
# same Forge config file works); the limit_* lines inside /ws below
# reference them. The game server also enforces its own per-IP budgets,
# so skipping this section degrades gracefully — belt + braces.
#
#   limit_conn_zone $binary_remote_addr zone=arx_ws_conn:10m;
#   limit_req_zone  $binary_remote_addr zone=arx_ws_req:10m rate=5r/s;

# The game WebSocket.
location /ws {
    # Per-IP: at most 15 open sockets, 5 new handshakes/sec (burst 10).
    limit_conn arx_ws_conn 15;
    limit_req zone=arx_ws_req burst=10 nodelay;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # A quiet-but-connected client should not be reaped mid-session.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Liveness probe (safe to expose: static JSON, no state).
location = /healthz {
    proxy_pass http://127.0.0.1:8790;
}

# The dev studio API must never be reachable from the internet. The
# server also refuses it when NODE_ENV=production, but belt + braces.
location /dev {
    return 404;
}

# Vite emits content-hashed filenames under /assets — cache hard.
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# The entry documents must always revalidate, or a browser's heuristic
# cache pins a player to yesterday's build (etag makes revalidation a
# cheap 304). Hashed assets above stay immutable; only the entry
# documents need this.
#
# THE FRONT DOOR: `/` is the landing page (landing.html); the game
# shell lives at `/play`. Direct hits on /index.html still reach the
# game, so old bookmarks keep working. The Vite dev server mirrors the
# /play and /landing spellings (vite.config.ts arx-entry-routes).
location = / {
    add_header Cache-Control "no-cache";
    try_files /landing.html =404;
}
location = /landing.html {
    add_header Cache-Control "no-cache";
}
# Extensionless spelling, for links that write /landing.
location = /landing {
    add_header Cache-Control "no-cache";
    try_files /landing.html =404;
}
location = /play {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Voice clips — served by the game server out of its data/voice store
# (hash-named, so the node response already carries a hard immutable
# cache header; nginx just relays). The store survives releases the
# way the web root never does.
location /voice/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
}
