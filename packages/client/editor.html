<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevCraft Map Studio</title>
    <link rel="stylesheet" href="/src/editor/editor.css" />
  </head>
  <body>
    <div id="editor">
      <header id="topbar">
        <div class="brand">DevCraft <span>Map Studio</span></div>
        <div class="group">
          <button id="btn-new">New</button>
          <button id="btn-open">Open ⌘O</button>
          <button id="btn-save" class="primary">Save ▸ Live ⌘S</button>
          <span id="dirty-dot" title="unsaved changes"></span>
        </div>
        <div class="group meta">
          <label>id <input id="zone-id" size="10" /></label>
          <label>name <input id="zone-name" size="12" /></label>
          <label>origin
            <input id="zone-ox" type="number" step="32" />
            <input id="zone-oy" type="number" step="32" />
          </label>
          <label>size
            <input id="zone-w" type="number" min="8" max="512" />
            ×
            <input id="zone-h" type="number" min="8" max="512" />
          </label>
          <button id="btn-resize" title="apply origin/size changes">apply</button>
        </div>
        <div class="group">
          <button id="btn-validate">Validate</button>
          <button id="btn-import">Import</button>
          <button id="btn-export">Export</button>
          <button id="btn-fit" title="fit zone (0)">Fit</button>
          <button id="btn-help">?</button>
        </div>
      </header>
      <div id="main">
        <nav id="toolbar"></nav>
        <div id="canvas-wrap"><canvas id="editor-canvas"></canvas></div>
        <aside id="sidebar">
          <section id="tool-options"></section>
          <section id="validation" class="hidden"></section>
          <section id="palette"></section>
        </aside>
      </div>
      <footer id="statusbar">
        <span id="st-coords">—</span>
        <span id="st-tile"></span>
        <span id="st-zone"></span>
        <span id="st-zoom"></span>
        <span id="st-server">…</span>
      </footer>
    </div>
    <dialog id="modal"><div id="modal-body"></div></dialog>
    <div id="toast"></div>
    <input type="file" id="file-load" accept=".json" hidden />
    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
