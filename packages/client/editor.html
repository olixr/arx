<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevCraft Map Editor</title>
    <link rel="stylesheet" href="/src/editor/editor.css" />
  </head>
  <body>
    <div id="editor">
      <aside id="sidebar">
        <h1>Map Editor</h1>
        <div class="row">
          <button id="btn-new">New</button>
          <button id="btn-load-town">Town</button>
          <input type="file" id="file-load" accept=".json" class="hidden" />
          <button id="btn-load">Load</button>
          <button id="btn-save">Save</button>
        </div>
        <div class="row meta">
          <label>id <input id="zone-id" type="text" value="myzone" /></label>
          <label>name <input id="zone-name" type="text" value="My Zone" /></label>
          <label>origin
            <input id="zone-ox" type="number" step="32" value="0" style="width:70px" />
            <input id="zone-oy" type="number" step="32" value="0" style="width:70px" />
          </label>
        </div>
        <h2>Ground</h2>
        <div id="tile-palette" class="palette"></div>
        <h2>Detail</h2>
        <div id="detail-palette" class="palette"></div>
        <p class="hint">
          Left-drag: paint · Right-drag: erase<br />
          Middle-drag / arrows: pan · Wheel: zoom<br />
          Shift+click: set spawn
        </p>
        <div id="status"></div>
      </aside>
      <canvas id="editor-canvas"></canvas>
    </div>
    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
