<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Arx</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="login" class="overlay">
      <div class="panel login-panel">
        <h1>Arx</h1>
        <p class="tagline">an open world, forged by hand</p>
        <form id="login-form">
          <input
            id="login-user"
            type="text"
            maxlength="20"
            minlength="3"
            placeholder="Username"
            autocomplete="username"
            required
          />
          <input
            id="login-pass"
            type="password"
            maxlength="100"
            minlength="6"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <input
            id="login-charname"
            class="hidden"
            type="text"
            maxlength="16"
            minlength="2"
            placeholder="Adventurer name"
            autocomplete="off"
          />
          <input
            id="login-invite"
            class="hidden"
            type="text"
            maxlength="64"
            placeholder="Invite code"
            autocomplete="off"
          />
          <button type="submit" id="login-submit">Enter World</button>
          <button type="button" id="login-toggle" class="link-button">
            New here? Create an account
          </button>
        </form>
        <p id="login-error" class="error hidden"></p>
        <p id="login-status" class="status hidden">Connecting…</p>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" type="text" maxlength="200" placeholder="Press Enter to chat" />
      </div>
      <div id="debug"></div>

      <div id="hotbar" aria-label="Abilities"></div>
      <div id="passive-tray" aria-label="Passives"></div>
      <div id="buff-tray" aria-label="Active buffs"></div>

      <div id="touch-controls" class="hidden">
        <button id="touch-attack" aria-label="Attack"></button>
      </div>

      <div id="panel-buttons">
        <button id="btn-inventory" title="Character (I)"></button>
        <button id="btn-skills" title="Skills (K)"></button>
        <button id="btn-arts" title="Techniques (V)"></button>
        <button id="btn-craft" title="Handiwork (C)"></button>
        <button id="btn-build" title="Build (B)"></button>
        <button id="btn-social" title="Social (U)"></button>
        <button id="btn-map" title="Map (M)"></button>
        <button id="btn-audio" title="Settings (O)"></button>
      </div>

      <!-- CHARACTER — the expedition case docked to the right edge:
           worn gear hung on an armor stand, the kit's sum as a ledger
           beside it, the backpack below. The case deliberately leaves
           the left of the screen open — the camera slides the world
           over so your LIVE character stands there, wearing every
           change the moment you make it. No duplicate figure. -->
      <div id="inventory-panel" class="ui-screen screen-character hidden">
        <h3>Character</h3>
        <div class="char-body">
          <!-- LEFT WING: who you are + what you wear + what it sums to. -->
          <section class="worn-kit">
            <div class="char-identity">
              <span id="char-name" class="ident-name"></span>
              <span id="char-deed" class="ident-deed"></span>
            </div>
            <div id="equip-anatomy"></div>
            <div class="kit-ledger">
              <div class="kit-ledger-title">The kit&rsquo;s sum</div>
              <div id="gear-strip" class="hidden"></div>
              <div class="kit-empty">Nothing worn adds to the sum yet &mdash; armor and trinkets will.</div>
            </div>
          </section>
          <!-- RIGHT WING: the whole backpack, every socket on screen. -->
          <section class="char-pack-col">
            <div class="pack-header">
              <div class="section-title">Backpack</div>
              <span id="pack-fill" class="pack-fill"></span>
            </div>
            <div id="pack-filters"></div>
            <div class="pack-case">
              <div id="inventory-grid"></div>
            </div>
            <div class="pack-foot">
              <span class="purse-label">Purse</span>
              <span id="coin-readout" data-tipname="Coins" title="Coins"></span>
            </div>
          </section>
        </div>
      </div>

      <!-- SETTINGS — sound and display, dialed from the couch. -->
      <div id="audio-panel" class="ui-screen screen-settings hidden">
        <h3>Settings</h3>
        <h4 class="menu-section">Sound</h4>
        <div id="audio-rows"></div>
        <h4 class="menu-section">Display</h4>
        <div id="display-rows"></div>
        <p id="audio-nowplaying" class="audio-now"></p>
      </div>

      <!-- SKILLS — the hall of deeds: disciplines grouped into wings.
           Techniques moved out to their own codex screen. -->
      <div id="skills-panel" class="ui-screen screen-skills hidden">
        <h3>Skills</h3>
        <div id="skills-list"></div>
      </div>

      <!-- TECHNIQUES — the codex of combat arts: your live Q/E/R/T
           loadout up top, each school's ladder of techniques below,
           the chosen art laid out large on the bench to the right. -->
      <div id="arts-panel" class="ui-screen screen-arts hidden">
        <h3>Techniques</h3>
        <div id="arts-loadout"></div>
        <div class="arts-main">
          <div id="arts-schools"></div>
          <div id="arts-detail"></div>
        </div>
      </div>

      <!-- WORKSHOP — every station's recipes as a ledger on the left,
           the chosen work laid out large on the right. -->
      <div id="craft-panel" class="ui-screen screen-craft hidden">
        <h3 id="craft-title">Crafting</h3>
        <div class="craft-body">
          <div class="craft-left">
            <div id="craft-tools"></div>
            <div id="craft-list" class="craft-ledger"></div>
          </div>
          <div id="craft-detail"></div>
        </div>
      </div>

      <!-- VAULT — stored goods as a wall of sockets; rolled gear kept
           apart in the armory rack. -->
      <div id="bank-panel" class="ui-screen screen-bank hidden">
        <h3>Vault</h3>
        <div class="bank-body">
          <div id="bank-armory" class="hidden"></div>
          <div id="bank-tools"></div>
          <div id="bank-list"></div>
          <div id="bank-detail" class="hidden"></div>
        </div>
      </div>

      <!-- STORE — the counter: goods shelved with honest price tags. -->
      <div id="shop-panel" class="ui-screen screen-shop hidden">
        <h3>General Store</h3>
        <div id="shop-list"></div>
      </div>

      <!-- BUILDER'S TABLE — blueprints spread out to choose from. -->
      <div id="build-panel" class="ui-screen screen-build hidden">
        <h3>Build</h3>
        <div id="build-list"></div>
      </div>

      <!-- SOCIAL — the fellowship ledger: who stands near, who walks
           with you, who is asking to. The body is built by
           ui/socialPanel.ts; only the banner lives here. -->
      <div id="social-panel" class="ui-screen screen-social hidden">
        <h3>Social</h3>
      </div>

      <!-- THE CHART TABLE — the fullscreen map (M). -->
      <div id="map-panel" class="ui-screen screen-map hidden">
        <h3>The Chart</h3>
      </div>

      <!-- THE RIFTGATE — the gate's question: which key turns? Each
           row is one dungeon, read pure from a key's roll. -->
      <div id="riftgate-panel" class="ui-screen screen-riftgate hidden">
        <h3>The Riftgate</h3>
        <div id="riftgate-list"></div>
      </div>

      <!-- THE BOARD — the deliberate read of a sign, and the pen for
           your own. The approach plaque is built in code and floats
           over the world; this is what pressing Interact opens. -->
      <div id="sign-panel" class="ui-tray hidden">
        <h3>The Board</h3>
        <div id="sign-body"></div>
      </div>

      <!-- ON THE GROUND — a quick tray beside the action, never a
           screen: grab and get back to the fight. -->
      <div id="loot-panel" class="ui-tray hidden">
        <h3>On the Ground</h3>
        <div id="loot-list" class="row-list"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
