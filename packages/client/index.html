<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DevCraft</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="login" class="overlay">
      <div class="panel login-panel">
        <h1>DevCraft</h1>
        <p class="tagline">an open world, forged by hand</p>
        <form id="login-form">
          <input
            id="login-user"
            type="text"
            maxlength="20"
            minlength="3"
            placeholder="Username"
            autocomplete="username"
            required
          />
          <input
            id="login-pass"
            type="password"
            maxlength="100"
            minlength="6"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <input
            id="login-charname"
            class="hidden"
            type="text"
            maxlength="16"
            minlength="2"
            placeholder="Adventurer name"
            autocomplete="off"
          />
          <button type="submit" id="login-submit">Enter World</button>
          <button type="button" id="login-toggle" class="link-button">
            New here? Create an account
          </button>
        </form>
        <p id="login-error" class="error hidden"></p>
        <p id="login-status" class="status hidden">Connecting…</p>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" type="text" maxlength="200" placeholder="Press Enter to chat" />
      </div>
      <div id="debug"></div>

      <div id="hotbar" aria-label="Abilities"></div>
      <div id="passive-tray" aria-label="Passives"></div>
      <div id="buff-tray" aria-label="Active buffs"></div>

      <div id="touch-controls" class="hidden">
        <button id="touch-attack" aria-label="Attack"></button>
      </div>

      <div id="panel-buttons">
        <button id="btn-inventory" title="Character (I)"></button>
        <button id="btn-skills" title="Skills (K)"></button>
        <button id="btn-craft" title="Handiwork (C)"></button>
        <button id="btn-build" title="Build (B)"></button>
        <button id="btn-audio" title="Settings (O)"></button>
      </div>

      <!-- CHARACTER — the hero screen: your figure on a stage, worn gear
           flanking the body it hangs on, the kit's sum told as a stat
           ledger, and the backpack as one full spread of sockets. -->
      <div id="inventory-panel" class="ui-screen screen-character hidden">
        <h3>Character</h3>
        <div class="char-body">
          <section class="char-stage-col">
            <div id="char-stage">
              <div id="equip-left" class="equip-col"></div>
              <div id="equip-fig">
                <div id="char-nameplate"></div>
                <div class="stage-turn">
                  <button id="fig-turn-l" class="turn-btn" title="Turn left">◀</button>
                  <button id="fig-turn-r" class="turn-btn" title="Turn right">▶</button>
                </div>
              </div>
              <div id="equip-right" class="equip-col"></div>
            </div>
            <div id="gear-strip" class="hidden"></div>
          </section>
          <section class="char-pack-col">
            <div class="pack-header">
              <div class="section-title">Backpack</div>
              <div id="pack-filters"></div>
              <span id="pack-fill" class="pack-fill"></span>
            </div>
            <div id="inventory-grid"></div>
            <div class="pack-foot">
              <span class="pack-hint hint-inline"
                >Drag an item onto the world to drop it</span
              >
              <span id="coin-readout" data-tipname="Coins" title="Coins"></span>
            </div>
          </section>
        </div>
      </div>

      <!-- SETTINGS — sound and display, dialed from the couch. -->
      <div id="audio-panel" class="ui-screen screen-settings hidden">
        <h3>Settings</h3>
        <h4 class="menu-section">Sound</h4>
        <div id="audio-rows"></div>
        <h4 class="menu-section">Display</h4>
        <div id="display-rows"></div>
        <p id="audio-nowplaying" class="audio-now"></p>
      </div>

      <!-- SKILLS — the hall of deeds: disciplines grouped into wings,
           combat arts carrying their technique ladders. -->
      <div id="skills-panel" class="ui-screen screen-skills hidden">
        <h3>Skills</h3>
        <div id="skills-list"></div>
      </div>

      <!-- WORKSHOP — every station's recipes as a ledger on the left,
           the chosen work laid out large on the right. -->
      <div id="craft-panel" class="ui-screen screen-craft hidden">
        <h3 id="craft-title">Crafting</h3>
        <div class="craft-body">
          <div class="craft-left">
            <div id="craft-tools"></div>
            <div id="craft-list" class="craft-ledger"></div>
          </div>
          <div id="craft-detail"></div>
        </div>
      </div>

      <!-- VAULT — stored goods as a wall of sockets; rolled gear kept
           apart in the armory rack. -->
      <div id="bank-panel" class="ui-screen screen-bank hidden">
        <h3>Vault</h3>
        <div class="bank-body">
          <div id="bank-armory" class="hidden"></div>
          <div id="bank-tools"></div>
          <div id="bank-list"></div>
          <div id="bank-detail" class="hidden"></div>
        </div>
      </div>

      <!-- STORE — the counter: goods shelved with honest price tags. -->
      <div id="shop-panel" class="ui-screen screen-shop hidden">
        <h3>General Store</h3>
        <div id="shop-list"></div>
      </div>

      <!-- BUILDER'S TABLE — blueprints spread out to choose from. -->
      <div id="build-panel" class="ui-screen screen-build hidden">
        <h3>Build</h3>
        <div id="build-list"></div>
      </div>

      <!-- ON THE GROUND — a quick tray beside the action, never a
           screen: grab and get back to the fight. -->
      <div id="loot-panel" class="ui-tray hidden">
        <h3>On the Ground</h3>
        <div id="loot-list" class="row-list"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
