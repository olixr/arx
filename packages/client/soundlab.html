<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sound Lab</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 24px 28px 80px;
        background: #22262b; color: #d7dbe0;
        font: 14px/1.5 -apple-system, 'Segoe UI', sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 2px; }
      .sub { color: #8b939d; margin: 0 0 18px; }
      h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em;
           color: #9fb4c8; margin: 26px 0 8px; }
      .row {
        display: flex; align-items: baseline; gap: 12px;
        padding: 7px 10px; border-radius: 6px;
      }
      .row:nth-child(odd) { background: #262b31; }
      .row button {
        flex: 0 0 64px; padding: 4px 0; border-radius: 5px; border: 1px solid #4a5561;
        background: #323a43; color: #e6eaee; cursor: pointer; font: inherit;
      }
      .row button:hover { background: #3d4753; }
      .row button:active { background: #2c88d9; }
      .name { flex: 0 0 200px; font-weight: 600; }
      .src { flex: 0 0 260px; color: #7fa5c0; font-family: ui-monospace, monospace; font-size: 12px; }
      .desc { color: #a7adb5; }
      .scen { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
      .scen button {
        padding: 5px 12px; border-radius: 6px; border: 1px solid #4a5561;
        background: #323a43; color: #e6eaee; cursor: pointer; font: inherit;
      }
      .scen button.on { background: #2c88d9; border-color: #2c88d9; }
      .gates { font-family: ui-monospace, monospace; font-size: 12px; color: #8b939d; margin: 4px 0 0 2px; }
      .ctl { display: flex; align-items: center; gap: 10px; margin: 8px 0; color: #a7adb5; }
      .ctl input[type='range'] { width: 220px; }
      #unlock {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(20, 23, 27, 0.92); font-size: 20px; color: #e6eaee; cursor: pointer; z-index: 10;
      }
      .note { color: #8b939d; font-size: 13px; margin: 4px 0 0 2px; }
    </style>
  </head>
  <body>
    <div id="unlock">Click anywhere to start audio</div>
    <h1>Sound Lab</h1>
    <p class="sub">Every ambient voice in the game, playable on demand — beds run under the scenario you pick; one-shots fire on their buttons.</p>
    <div id="lab"></div>
    <script type="module" src="/src/dev/soundlab.ts"></script>
  </body>
</html>
